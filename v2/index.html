<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#06101f" />
    <meta name="color-scheme" content="dark" />
    <!-- CSP mirrors V1: Spotify embed + IFrame API ('unsafe-eval' is required by
         Spotify's API), Google Fonts. Nothing broader. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' 'unsafe-eval' https://open.spotify.com https://embed-cdn.spotifycdn.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https://*.spotifycdn.com https://i.scdn.co;
        connect-src 'self' https://open.spotify.com https://*.spotify.com;
        frame-src https://open.spotify.com;
        base-uri 'self';
        form-action 'none';
        object-src 'none'"
    />
    <link rel="icon" href="/aqours-sunshine-tribute/v2/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/aqours-sunshine-tribute/v2/favicon-32.png" />
    <link rel="apple-touch-icon" href="/aqours-sunshine-tribute/v2/apple-touch-icon.png" />
    <title>Aqours — Love Live! Sunshine!! Fan Tribute</title>
    <meta name="description" content="A fan-made tribute to Aqours, the nine-member school idol group from Love Live! Sunshine!! — their colors, their story, their music." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aqours — Love Live! Sunshine!! Fan Tribute" />
    <meta property="og:description" content="Nine hearts, nine colors, one shining sea — a fan-made tribute to Aqours." />
    <meta property="og:image" content="https://amiris01.github.io/aqours-sunshine-tribute/v2/assets/logo/aqours-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
